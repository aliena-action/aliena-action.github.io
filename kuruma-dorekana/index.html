<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>くるまどれかな？ MVP</title>
<style>
:root{--ink:#4b4037;--paper:#fffdf5;--sky:#7fd3ff;--road:#b9b9b9}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#9bddff}.app{position:fixed;inset:0;background:linear-gradient(#76d5ff 0 39%,#9ee06d 39% 43%,#bababa 43% 100%);overflow:hidden}.app:before{content:"";position:absolute;left:0;right:0;top:59%;height:5%;background:repeating-linear-gradient(90deg,transparent 0 6vw,#fff 6vw 11vw,transparent 11vw 17vw);opacity:.95}.hill{position:absolute;top:31%;width:34vw;height:15vh;border-radius:50% 50% 0 0;background:#8bd85a;opacity:.7}.hill.l{left:7vw}.hill.r{right:8vw}.cloud{position:absolute;top:8%;width:13vw;height:6vh;border-radius:999px;background:#fff;filter:drop-shadow(0 2px 0 rgba(255,255,255,.6));opacity:.92}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:#fff}.cloud:before{width:45%;height:90%;left:15%;top:-42%}.cloud:after{width:42%;height:75%;right:15%;top:-28%}.cloud.c1{left:12%}.cloud.c2{right:12%;top:10%;transform:scale(.8)}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}.title{justify-content:center;gap:3vh;background:rgba(255,255,255,.22)}.logo{font-size:clamp(34px,10vw,88px);font-weight:900;letter-spacing:.02em;color:#ef3f26;text-shadow:0 .08em #fff, .08em 0 #fff, -.08em 0 #fff,0 -.08em #fff,0 .16em .18em rgba(0,0,0,.18)}.logo b:nth-child(2){color:#1d78d6}.logo b:nth-child(3){color:#42a833}.lead,.msg{background:var(--paper);border:3px solid rgba(75,64,55,.15);border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.13);font-weight:900;text-align:center}.lead{font-size:clamp(17px,4.4vw,30px);padding:.45em 1.25em}.start{font:inherit;font-size:clamp(23px,6vw,44px);font-weight:900;color:#fff;background:#42b949;border:0;border-radius:999px;min-width:42vw;min-height:14vh;box-shadow:0 7px 0 #23842a}.start:active{transform:translateY(4px);box-shadow:0 3px 0 #23842a}.play{justify-content:space-between;padding:1.6vh 3vw 2vh}.msg{font-size:clamp(15px,4vw,30px);padding:.35em 1.05em;max-width:94vw;min-height:2.4em;display:flex;align-items:center;z-index:3}.msg.pop{animation:pop .35s ease}.sampleLane,.choiceLane{width:100%;display:flex;align-items:center;justify-content:center}.sampleLane{height:34vh}.choiceLane{height:40vh;gap:3vw;align-items:flex-end;padding-bottom:1vh}.choice{border:0;background:transparent;padding:clamp(8px,2.4vw,24px);border-radius:28px;touch-action:manipulation}.choice:active{transform:scale(.97)}.carWrap{width:clamp(108px,25vw,240px);aspect-ratio:1.25;display:flex;align-items:flex-end;justify-content:center}.sample .carWrap{width:clamp(120px,28vw,260px)}svg.car{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 3px rgba(0,0,0,.16))}.enter{animation:enter .5s ease both}.sampleIn{animation:sampleIn .62s ease-out both}.wiggle{animation:wiggle .52s ease}.jump{animation:jump .72s cubic-bezier(.2,1.4,.35,1)}.fade{opacity:.28;transform:scale(.88);transition:.3s}.sparkle{position:absolute;pointer-events:none;font-size:clamp(20px,5vw,38px);animation:spark .8s ease-out forwards}.hide{display:none!important}.rotate{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;background:#fffdf5;text-align:center;font-weight:900;font-size:7vw}.debug{position:absolute;right:1vw;bottom:.5vh;font-size:11px;opacity:.36}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}@keyframes enter{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}@keyframes sampleIn{from{opacity:0;transform:translateX(-52vw)}to{opacity:1;transform:translateX(0)}}@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px) rotate(-2deg)}40%{transform:translateX(8px) rotate(2deg)}60%{transform:translateX(-6px) rotate(-1deg)}80%{transform:translateX(4px) rotate(1deg)}}@keyframes jump{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-32px) scale(1.08)}60%{transform:translateY(4px) scale(.98)}}@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25)}}@media (orientation:portrait){.rotate{display:flex}.app{filter:blur(3px)}}
</style>
</head>
<body>
<div class="app" id="app"><div class="hill l"></div><div class="hill r"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<section class="screen title" id="title"><div class="logo"><span>くるま</span><b>どれ</b><b>かな?</b></div><p class="lead">くるまを えらんで あそぼう！</p><button class="start" id="start">スタート</button><div class="debug">MVP preview</div></section>
<section class="screen play hide" id="play"><div class="msg" id="msg">このくるまと おなじ くるまを えらんでね</div><div class="sampleLane"><div id="sample" class="sample"></div></div><div class="choiceLane" id="choices"></div><div id="fx"></div></section>
</div><div class="rotate">📱↻<br>よこむきに してね</div>
<script>
const CARS=[{id:'red',color:'#ef2e20',label:'あか'},{id:'blue',color:'#0975cf',label:'あお'},{id:'yellow',color:'#ffc21a',label:'きいろ'},{id:'green',color:'#3dab35',label:'みどり'}];
const MSG={sample:'このくるまと おなじ くるまを えらんでね',correct:'やったー！ おなじだね！',wrong:['えへへ、ぼくじゃないよ〜','もういちど！']};
const T={sampleToChoose:1500,correctToNext:1800,wrongLock:650};
const el={title:document.getElementById('title'),play:document.getElementById('play'),start:document.getElementById('start'),msg:document.getElementById('msg'),sample:document.getElementById('sample'),choices:document.getElementById('choices'),fx:document.getElementById('fx')};
let state={sample:null,last:null,locked:false};
function carSvg(car){return `<div class="carWrap"><svg class="car" viewBox="0 0 300 220" role="img" aria-label="${car.label}のくるま"><filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency=".055" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter><g filter="url(#crayon)"><path d="M42 143c-7-38 15-55 51-61 9-42 40-59 92-56 52 3 76 23 82 77 22 7 34 21 32 43-3 34-26 43-63 38H83c-26 0-38-12-41-41z" fill="${car.color}" stroke="#3b332f" stroke-width="7" stroke-linejoin="round"/><path d="M105 83c5-29 22-41 55-39v62h-63c1-8 3-16 8-23zM171 45c41 1 58 17 63 61h-63z" fill="#a9e9ff" stroke="#3b332f" stroke-width="5"/><ellipse cx="132" cy="86" rx="18" ry="30" fill="#fff"/><ellipse cx="182" cy="86" rx="18" ry="30" fill="#fff"/><ellipse cx="137" cy="91" rx="10" ry="18" fill="#111"/><ellipse cx="187" cy="91" rx="10" ry="18" fill="#111"/><circle cx="141" cy="80" r="5" fill="#fff"/><circle cx="191" cy="80" r="5" fill="#fff"/><rect x="46" y="126" width="24" height="23" rx="5" fill="#ffe06a" stroke="#8b6d00" stroke-width="4"/><rect x="274" y="137" width="16" height="24" rx="5" fill="#e74b3b"/><rect x="127" y="130" width="28" height="8" rx="5" fill="#2f5d95" opacity=".55"/><rect x="220" y="132" width="28" height="8" rx="5" fill="#2f5d95" opacity=".55"/><circle cx="92" cy="174" r="31" fill="#222" stroke="#111" stroke-width="5"/><circle cx="228" cy="174" r="31" fill="#222" stroke="#111" stroke-width="5"/><circle cx="92" cy="174" r="16" fill="#eee"/><circle cx="228" cy="174" r="16" fill="#eee"/></g></svg></div>`}
function rnd(n){return Math.floor(Math.random()*n)}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function popMsg(t){el.msg.textContent=t;el.msg.classList.remove('pop');void el.msg.offsetWidth;el.msg.classList.add('pop')}
function newQuestion(){let pool=CARS.filter(c=>c.id!==state.last);state.sample=pool[rnd(pool.length)]||CARS[0];state.last=state.sample.id;state.locked=true;el.choices.innerHTML='';el.sample.innerHTML=carSvg(state.sample);el.sample.firstChild.classList.add('sampleIn');popMsg(MSG.sample);setTimeout(showChoices,T.sampleToChoose)}
function showChoices(){const others=shuffle(CARS.filter(c=>c.id!==state.sample.id)).slice(0,2);shuffle([state.sample,...others]).forEach(car=>{const b=document.createElement('button');b.className='choice enter';b.type='button';b.innerHTML=carSvg(car);b.onclick=()=>tap(b,car);el.choices.appendChild(b)});state.locked=false}
function tap(btn,car){if(state.locked)return;if(car.id===state.sample.id)correct(btn);else wrong(btn)}
function wrong(btn){state.locked=true;btn.classList.remove('wiggle');void btn.offsetWidth;btn.classList.add('wiggle');popMsg(MSG.wrong[rnd(MSG.wrong.length)]);setTimeout(()=>state.locked=false,T.wrongLock)}
function correct(btn){state.locked=true;btn.classList.add('jump');[...el.choices.children].forEach(c=>{if(c!==btn)c.classList.add('fade')});popMsg(MSG.correct);spark(btn);setTimeout(newQuestion,T.correctToNext)}
function spark(btn){const r=btn.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<11;i++){const s=document.createElement('span');s.className='sparkle';s.textContent=['✨','⭐','🌟'][rnd(3)];s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.PI*2*i/11,d=55+Math.random()*70;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d-45+'px');document.body.appendChild(s);s.onanimationend=()=>s.remove()}}
el.start.onclick=()=>{el.title.classList.add('hide');el.play.classList.remove('hide');newQuestion()};
</script>
</body></html>
